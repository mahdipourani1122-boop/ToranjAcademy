{% extends 'accounts/base_auth.html' %}

{% block title %}رمز عبور تغییر یافت | آکادمی زبان تُرنج{% endblock %}

{% block auth_content %}
<div class="text-center space-y-4 py-2">
    <div class="w-14 h-14 rounded-2xl bg-toranj-success/10 text-toranj-success flex items-center justify-center mx-auto">
        <i data-lucide="check-circle-2" class="w-7 h-7"></i>
    </div>
    <h1 class="text-[22px] font-extrabold text-toranj-textMain">رمز عبور با موفقیت تغییر یافت</h1>
    <p class="text-[15px] text-toranj-textMuted">اکنون می‌توانید با رمز عبور جدید وارد حساب کاربری خود شوید.</p>
    <div class="pt-2">
        <a href="{% url 'accounts:login' %}" class="btn-primary-orange px-8">ورود به حساب کاربری</a>
    </div>
</div>
{% endblock %}
